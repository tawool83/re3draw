[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "re3draw-worker"
version = "0.1.0"
description = "re3draw reconstruction worker: marker-mat camera poses, COLMAP export, 3D training"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-contrib-python-headless>=4.8",
    "pillow>=10.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Training needs a CUDA machine; see docs/m2-gpu-training.md. gsplat builds CUDA kernels on
# install, so torch has to be present first - install torch, then this extra.
train = ["torch>=2.2", "gsplat>=1.4"]
# Niantic's .spz encoder (MIT). Not on PyPI, so it is not listed as a dependency:
#   pip install "git+https://github.com/nianticlabs/spz"

[project.scripts]
re3draw-worker = "re3draw_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
